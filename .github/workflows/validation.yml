name: Full validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Superseded PR revisions can stop testing; Pages uses a separate group.
concurrency:
  group: full-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  full-validation:
    name: Full regression suite
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install native build tools and audio backend
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 verilator emscripten pulseaudio
          verilator --version
          em++ --version
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox
      # Firefox needs a real Web Audio output device even when headless.
      - name: Start audio output for browser tests
        run: |
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=webrtl_ci rate=48000
          pactl set-default-sink webrtl_ci
          pactl list short sinks
      # npm test already includes both static browser projects, including every
      # SNES cartridge batch. Do not run those suites a second time here.
      - name: Run comprehensive Python, trusted-local and static browser tests
        id: tests
        run: npm test
      - name: Summarize full validation
        if: always()
        env:
          RESULT: ${{ steps.tests.outcome }}
        run: |
          {
            echo "## Full regression suite"
            echo "Source commit: $GITHUB_SHA"
            echo "npm test: $RESULT; job status: ${{ job.status }}"
            echo "Configured coverage: Python service/assets, trusted-local Chromium, static Chromium and Firefox, counter, CPU, BG1, audio/video and all SNES cartridge batches."
            echo "Inspect the failing step and test-results artifact for details. Require a successful full check before merge; this workflow does not gate publication."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload browser failure details
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: full-validation-failure
          path: test-results/
          if-no-files-found: ignore
