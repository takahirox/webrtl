name: Publish GitHub Pages

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  # Let an active deployment finish; newer pushes replace only the pending run.
  cancel-in-progress: false

jobs:
  build:
    name: Build and smoke test Pages
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      started_at: ${{ steps.clock.outputs.started_at }}
    steps:
      - name: Start publication clock
        id: clock
        run: echo "started_at=$(date +%s)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Build this commit's static site
        id: site
        run: npm run build:demo
      - name: Smoke test the built /webrtl/ artifact
        id: smoke
        run: npm run test:pages
      - name: Upload tested static site
        id: upload
        uses: actions/upload-pages-artifact@v4
        with:
          path: .build/pages/webrtl
      - name: Summarize build and smoke
        if: always()
        env:
          BUILD: ${{ steps.site.outcome }}
          SMOKE: ${{ steps.smoke.outcome }}
          UPLOAD: ${{ steps.upload.outcome }}
          STARTED_AT: ${{ steps.clock.outputs.started_at }}
        run: |
          {
            echo "## Pages build"
            echo "Source commit: $GITHUB_SHA"
            echo "Build: $BUILD; bounded Chromium smoke: $SMOKE"
            echo "Artifact: github-pages (.build/pages/webrtl); upload: $UPLOAD"
            echo "Build job elapsed: $(($(date +%s) - STARTED_AT)) seconds"
            if [ "$UPLOAD" != success ]; then
              echo "Deployment: blocked by unsuccessful build/smoke/upload; URL: unavailable"
            elif [ "$GITHUB_EVENT_NAME" = pull_request ]; then
              echo "Deployment: skipped for PR; URL: unavailable"
            else
              echo "Deployment: pending; final status and URL are reported by the deploy job."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload smoke failure details
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pages-smoke-failure
          path: test-results/
          if-no-files-found: ignore

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy tested artifact
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Summarize deployment
        if: always()
        env:
          STATUS: ${{ steps.deployment.outcome }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          STARTED_AT: ${{ needs.build.outputs.started_at }}
        run: |
          {
            echo "## Pages deployment"
            echo "Source commit: $GITHUB_SHA"
            echo "Artifact: github-pages from this run's successful build and smoke"
            echo "Deployment: $STATUS; URL: ${PAGE_URL:-unavailable}"
            echo "Publication elapsed from build job start: $(($(date +%s) - STARTED_AT)) seconds (includes time waiting for deployment)"
            echo "Target: under 10 minutes excluding runner/environment approval queues; inspect Actions timings if exceeded."
          } >> "$GITHUB_STEP_SUMMARY"
