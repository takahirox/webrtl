name: Build, test, and deploy counter demo

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 verilator emscripten
          verilator --version
          em++ --version
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Includes both the trusted-local flow and a fresh static build tested at /webrtl/.
      - run: npm test
      - name: Upload tested static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .build/pages/webrtl

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy tested artifact
        id: deployment
        uses: actions/deploy-pages@v4
